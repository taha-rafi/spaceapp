services:
  postgres:
    image: ${SPACE_DEV_POSTGRES_IMAGE:?launcher supplies canonical image}
    restart: unless-stopped
    environment:
      POSTGRES_DB: spaceapp
      POSTGRES_USER: spaceapp
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets:
      - postgres-password
    ports:
      - "127.0.0.1:${SPACE_DEV_DB_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spaceapp -d spaceapp"]
      interval: 5s
      timeout: 5s
      retries: 20

  temporal:
    image: ${SPACE_DEV_TEMPORAL_IMAGE:?launcher supplies canonical image}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SPACE_DEV_TEMPORAL_PORT:-57233}:7233"
    environment:
      # Keep internal gRPC traffic off inherited HTTP proxies.
      NO_PROXY: "localhost,127.0.0.1,temporal,postgres,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16"
      no_proxy: "localhost,127.0.0.1,temporal,postgres,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16"
      DEFAULT_NAMESPACE: spaceapp-contributor
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: spaceapp
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/docker.yaml
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - export POSTGRES_PWD="$$(cat /run/secrets/postgres-password)"; exec su temporal -s /bin/sh -c 'exec /etc/temporal/entrypoint.sh autosetup'
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address temporal:7233 >/dev/null && temporal operator namespace describe --namespace spaceapp-contributor --address temporal:7233 >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
    secrets:
      - postgres-password
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
    labels:
      spaceapp.dev-stack: "true"

secrets:
  postgres-password:
    file: ${SPACE_DEV_SECRETS_DIR}/postgres-password
